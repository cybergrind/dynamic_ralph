[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'dynamic-ralph'
version = '0.3.0'
description = 'Dynamic Ralph: step-based multi-agent workflow orchestrator for Claude Code'
authors = [{ name = 'github.com/cybergrind' }]
license = { text = 'Apache-2.0' }
requires-python = '>=3.13'
dependencies = [
  'pydantic>=2.0',
]

[project.scripts]
dynamic-ralph = 'bin.run_dynamic_ralph:main'
ralph-agent = 'bin.run_agent:main'
ralph-retro = 'bin.run_retrospective:main'

[tool.hatch.build]
exclude = ['.claude', 'run_ralph', '.env']

[tool.hatch.build.targets.wheel]
packages = ['multi_agent', 'bin']

[tool.hatch.build.targets.wheel.force-include]
'docker/Dockerfile' = 'multi_agent/_data/docker/Dockerfile'
'CLAUDE.md' = 'multi_agent/_data/CLAUDE.md'
'docs' = 'multi_agent/_data/docs'
'skills' = 'multi_agent/_data/skills'
'pyproject.toml' = 'multi_agent/_data/pyproject.toml'
'uv.lock' = 'multi_agent/_data/uv.lock'
'.pre-commit-config.yaml' = 'multi_agent/_data/.pre-commit-config.yaml'

# installed with: uv sync
[dependency-groups]
dev = ['ruff', 'pre-commit>=4.1.0', 'uv>=0.10.2', 'pytest>=8.0', 'pytest-asyncio>=0.24']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']

[tool.ruff]
line-length = 120
target-version = 'py313'
indent-width = 4
exclude = ['.venv', '.git']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ['multi_agent']
lines-after-imports = 2

[tool.ruff.lint]
ignore = [
  'T201',  # print
  'G004',  # logging format
  'Q000',  # quotes
  'Q001',  # quotes
  'Q003',  # quotes
]
fixable = ['ALL']
select = [
  'E',     # pycodestyle
  'F',     # pyflakes
  'I',     # isort
  'G',     # flake8-logging-format
  'ASYNC', # flake8-async
  'PIE',   # flake8-pie
  'T20',   # flake8-print
  'PT',    # flake8-pytest-style
  'Q',     # flake8-quotes
  'RUF',
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'
multiline-quotes = 'single'
