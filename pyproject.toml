[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'dynamic-ralph'
version = '0.5.4'
description = 'Dynamic Ralph: step-based multi-agent workflow orchestrator for Claude Code'
authors = [{ name = 'github.com/cybergrind' }]
license = { text = 'Apache-2.0' }
requires-python = '>=3.13'
dependencies = [
  'pydantic>=2.0',
  "textual>=8.2.3",
]

[project.scripts]
dynamic-ralph = 'bin.run_dynamic_ralph:main'
ralph-agent = 'bin.run_agent:main'
ralph-retro = 'bin.run_retrospective:main'
ralph-trace = 'bin.run_trace:main'
ask-llm = 'coworker_llm.ask_llm:main'
llm-write = 'coworker_llm.llm_write:main'
extract-chat = 'coworker_llm.extract_chat:main'

[tool.hatch.build]
exclude = ['.claude', 'run_ralph', '.env']

[tool.hatch.build.targets.wheel]
packages = ['multi_agent', 'bin', 'coworker_llm']

[tool.hatch.build.targets.wheel.force-include]
'docker/Dockerfile' = 'multi_agent/_data/docker/Dockerfile'
'CLAUDE.md' = 'multi_agent/_data/CLAUDE.md'
'docs' = 'multi_agent/_data/docs'
'skills' = 'multi_agent/_data/skills'
'pyproject.toml' = 'multi_agent/_data/pyproject.toml'
'uv.lock' = 'multi_agent/_data/uv.lock'
'.pre-commit-config.yaml' = 'multi_agent/_data/.pre-commit-config.yaml'

# installed with: uv sync
[dependency-groups]
dev = [
    'ruff',
    'pre-commit>=4.1.0',
    'uv>=0.10.2',
    'pytest>=8.0',
    'pytest-asyncio>=0.24',
    "pyrefly>=0.59.1",
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
markers = [
  'integration: hits real external services via a coworker LLM backend; opt-in via RUN_INTEGRATION=1',
]

[tool.ruff]
line-length = 120
target-version = 'py313'
indent-width = 4
exclude = ['.venv', '.git']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ['multi_agent', 'coworker_llm']
lines-after-imports = 2

[tool.ruff.lint]
ignore = [
  'T201',  # print
  'G004',  # logging format
  'Q000',  # quotes
  'Q001',  # quotes
  'Q003',  # quotes
]
fixable = ['ALL']
select = [
  'E',     # pycodestyle
  'F',     # pyflakes
  'I',     # isort
  'G',     # flake8-logging-format
  'ASYNC', # flake8-async
  'PIE',   # flake8-pie
  'T20',   # flake8-print
  'PT',    # flake8-pytest-style
  'Q',     # flake8-quotes
  'RUF',
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'
multiline-quotes = 'single'

[tool.pyrefly]
project-includes = ['multi_agent', 'tests', 'bin', 'coworker_llm']
python-version = '3.13'
python-platform = 'linux'
site-package-path = ['.venv/lib/python3.13/site-packages']
